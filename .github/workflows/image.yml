name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build pinned base with Plow Hours
        run: docker build --build-arg PLOW_HOURS_REVISION="$GITHUB_SHA" -t ghcr.io/enzotironi/plow-hours:check .
      - name: Typecheck and test the installed plugin
        run: |
          docker run --rm --user root --network none \
            -v "$PWD/node_modules:/opt/plow/node_modules:ro" \
            -v "$PWD/tests:/opt/plow/tests:ro" \
            ghcr.io/enzotironi/plow-hours:check sh -c \
            '/opt/plow/node_modules/.bin/tsc --noEmit -p /opt/plow/tsconfig.json && mkdir -p /opt/plow/plugin/node_modules && ln -s /app /opt/plow/plugin/node_modules/openclaw && node --test --test-timeout=180000 /opt/plow/tests/*.test.ts'
      - name: Probe gateway authentication and timesheet
        run: docker run --rm --network none ghcr.io/enzotironi/plow-hours:check /opt/plow/probe
      - name: Publish the checked release image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag ghcr.io/enzotironi/plow-hours:check "ghcr.io/enzotironi/plow-hours:$GITHUB_REF_NAME"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/plow-pbc/plow-agents/53dd92242e88f6e877cc09dbfb08b31b0e3925cb/bin/plow-agents \
            -o /tmp/plow-agents
          python3 /tmp/plow-agents image push "ghcr.io/enzotironi/plow-hours:$GITHUB_REF_NAME"
