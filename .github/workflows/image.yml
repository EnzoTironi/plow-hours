name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build pinned base with Ours
        run: docker build --build-arg PLOW_HOURS_REVISION="$GITHUB_SHA" -t ghcr.io/enzotironi/plow-hours:check .
      - name: Typecheck and test the installed plugin
        run: |
          docker run --rm --user root --network none \
            -v "$PWD/node_modules:/opt/plow/node_modules:ro" \
            -v "$PWD/tests:/opt/plow/tests:ro" \
            ghcr.io/enzotironi/plow-hours:check sh -c \
            '/opt/plow/node_modules/.bin/tsc --noEmit -p /opt/plow/tsconfig.json && mkdir -p /opt/plow/plugin/node_modules && ln -s /app /opt/plow/plugin/node_modules/openclaw && node --test --test-timeout=180000 /opt/plow/tests/*.test.ts'
      - name: Probe gateway authentication and timesheet
        run: docker run --rm --network none ghcr.io/enzotironi/plow-hours:check /opt/plow/probe
      - name: Confirm committed clocks survive silent and blocked model replies
        run: |
          docker run --rm --user root --network none \
            -e PLOW_AGENT_TOKEN=fixture-only -e EVAL_PHASE=clock_confirmation -e EVAL_OUTPUT=/tmp/evidence \
            -v "$PWD/evals:/opt/plow/evals:ro" \
            ghcr.io/enzotironi/plow-hours:check node /opt/plow/evals/conversation.mjs
      - name: Check the local proxy and evaluator network boundaries
        run: node tests/dev-boundaries.mjs
      - name: Publish the checked release image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag ghcr.io/enzotironi/plow-hours:check "ghcr.io/enzotironi/plow-hours:$GITHUB_REF_NAME-${{ matrix.arch }}"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/plow-pbc/plow-agents/53dd92242e88f6e877cc09dbfb08b31b0e3925cb/bin/plow-agents \
            -o /tmp/plow-agents
          python3 /tmp/plow-agents image push "ghcr.io/enzotironi/plow-hours:$GITHUB_REF_NAME-${{ matrix.arch }}"
  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Publish the checked native platforms together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create \
            --tag "ghcr.io/enzotironi/plow-hours:$GITHUB_REF_NAME" \
            "ghcr.io/enzotironi/plow-hours:$GITHUB_REF_NAME-amd64" \
            "ghcr.io/enzotironi/plow-hours:$GITHUB_REF_NAME-arm64"
